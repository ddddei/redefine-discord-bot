<!doctype html>
<html lang="ko" style="--paper: #efe3c8; background-color: var(--paper);">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#efe3c8">
    <meta
      name="description"
      content="프로젝트 리디파인 참여자를 위한 브라우저 덱빌딩 게임, 간식 수호대입니다."
    >
    <title>간식 수호대</title>
    <link rel="preload" as="image" href="../shared/art/shared-char-baker.webp">
    <link rel="stylesheet" href="../shared/game-ui.css">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-frame gk-stage">
      <header class="gk-header">
        <div class="gk-header-title">
          <p class="gk-header-subline">간식 수호대</p>
          <p id="run-progress-label" class="run-progress-label">1 / 13층</p>
        </div>
        <div class="gk-header-chips">
          <img class="player-asset" src="../shared/art/shared-char-baker.webp" alt="" decoding="async" fetchpriority="high">
          <div class="gk-chip hp-chip">
            <span>체력</span>
            <strong id="player-hp-value">60 / 60</strong>
          </div>
        </div>
      </header>

      <div id="relic-row" class="relic-row" aria-label="보유 유물"></div>

      <main class="app-main">
        <section id="screen-run" class="screen" data-screen="run">
          <p id="run-node-description" class="run-node-description">다음 층으로 나아갈 노드를 골라 보세요.</p>
          <div id="daily-run-chip" class="gk-challenge-chip hidden">오늘의 도전 런</div>
          <div id="daily-run-actions" class="run-actions">
            <button id="daily-run-button" type="button" class="gk-button secondary">오늘의 도전으로 시작</button>
          </div>
          <div id="map-scroll" class="map-scroll" aria-label="갈림길 맵"></div>
        </section>

        <section id="screen-event" class="screen hidden" data-screen="event">
          <h2 id="event-title" class="screen-heading">이벤트</h2>
          <p id="event-body" class="screen-copy"></p>
          <div id="event-choice-list" class="event-choice-list"></div>
          <div id="event-followup" class="event-followup hidden">
            <p id="event-followup-label" class="screen-copy"></p>
            <div id="event-followup-list" class="rest-remove-list"></div>
          </div>
        </section>

        <section id="screen-combat" class="screen hidden" data-screen="combat">
          <!-- 전투 무대(고도화 v1 3-A): 적(우상)과 플레이어(좌하)가 대각으로 마주 보는
               대치 구도. 기존 렌더 배선(id)은 그대로 두고 배치만 바꾼다. -->
          <div class="battle-stage">
            <div class="enemy-side">
              <p id="enemy-name" class="enemy-name">적</p>
              <div class="enemy-art-window">
                <img class="enemy-asset" src="../shared/assets/deck-enemy-crumb-ant.svg" alt="" loading="lazy" decoding="async">
              </div>
              <div class="hp-bar enemy-hp-bar" aria-hidden="true">
                <div id="enemy-hp-bar-fill" class="hp-bar-fill"></div>
              </div>
              <div class="enemy-stat-row">
                <span id="enemy-hp-value" class="enemy-hp-value">0 / 0</span>
                <span id="enemy-block-value" class="enemy-block-value hidden">방어 0</span>
              </div>
              <div class="enemy-status-row" id="enemy-status-row"></div>
              <div class="enemy-intent" id="enemy-intent">
                <span class="intent-label">다음 행동</span>
                <span id="enemy-intent-value" class="intent-value">-</span>
              </div>
            </div>

            <div class="player-side" id="player-side">
              <img id="player-stage-asset" class="player-stage-asset" src="../shared/art/shared-char-baker.webp" alt="" decoding="async">
              <div class="hp-bar player-hp-bar" aria-hidden="true">
                <div id="player-hp-bar-fill" class="hp-bar-fill"></div>
              </div>
              <div class="player-stat-row">
                <span id="player-stage-hp" class="player-stage-hp">60 / 60</span>
                <span id="player-block-value" class="player-block-value hidden">방어 0</span>
              </div>
              <div class="player-status-row" id="player-status-row"></div>
            </div>
          </div>

          <div class="hand-area">
            <div id="hand-list" class="hand-list"></div>
          </div>

          <div class="combat-controls">
            <div class="energy-chip">
              <span>에너지</span>
              <strong id="energy-value">3</strong>
            </div>
            <button id="end-turn-button" type="button" class="gk-button primary">턴 종료</button>
          </div>
        </section>

        <section id="screen-reward" class="screen hidden" data-screen="reward">
          <h2 class="screen-heading">카드를 골라 보세요</h2>
          <div id="reward-card-list" class="reward-card-list"></div>
          <button id="skip-reward-button" type="button" class="gk-button secondary">건너뛰기</button>
        </section>

        <section id="screen-rest" class="screen hidden" data-screen="rest">
          <h2 class="screen-heading">휴식</h2>
          <p class="screen-copy">회복하거나 덱에서 카드 한 장을 정리할 수 있어요.</p>
          <div class="rest-options">
            <button id="rest-heal-button" type="button" class="gk-button primary">회복하기</button>
            <button id="rest-remove-button" type="button" class="gk-button secondary">덱 정리하기</button>
          </div>
          <div id="rest-remove-list" class="rest-remove-list hidden"></div>
        </section>

        <section id="screen-result" class="screen hidden" data-screen="result">
          <h2 id="result-heading" class="screen-heading">런 종료</h2>
          <p id="result-copy" class="screen-copy"></p>
          <dl class="result-stats">
            <div><dt>도달한 층</dt><dd id="result-node">0 / 13</dd></div>
            <div><dt>처치 수</dt><dd id="result-defeated">0</dd></div>
            <div><dt>최종 덱 수</dt><dd id="result-deck-size">0</dd></div>
            <div><dt>클리어 횟수</dt><dd id="result-clear-count">0</dd></div>
            <div><dt>최고 도달 층</dt><dd id="result-best-node">0</dd></div>
          </dl>
          <div id="result-link-section"></div>
          <div id="result-daily-section"></div>
          <div id="result-ranking-section"></div>
          <button id="restart-button" type="button" class="gk-button primary">새로 시작</button>
        </section>
      </main>

      <p id="migration-notice" class="migration-notice hidden"></p>

      <div id="hit-flash" class="hit-flash" aria-hidden="true"></div>
    </div>

    <script src="../shared/link.js"></script>
    <script src="./content.js"></script>
    <script src="./engine.js"></script>
    <script src="./game.js"></script>
  </body>
</html>
