name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check source syntax
        run: |
          node --check src/index.js
          node --check src/deploy-commands.js

      - name: Validate data
        run: npm run validate:data

      - name: Test question matching
        run: npm run test:questions
